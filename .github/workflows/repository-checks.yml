name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check cloud-coding documentation exists
        shell: bash
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s .editorconfig
          test -s .gitignore

      - name: Reject tracked local environment files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Do not commit local environment files:"
            echo "$tracked_env_files"
            exit 1
          fi
          echo "No local environment files are tracked."

