name: Release

# This workflow is not started by a tag push. It appears in the Actions tab
# only after this file is on the default branch. Running it with the confirm
# field set to publish creates a draft release and the matching git tag.
# Publishing that draft is a separate step, and it is the approval to offer
# the zip as a direct download.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to attach zoop-<version>.zip to a draft release. Anything else stops before a release is created."
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Require approval
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "Refusing to create a release. Type publish in the confirm field." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the installable plugin
        run: bash scripts/package-plugin.sh

      - name: Read the plugin version
        id: version
        run: |
          version="$(php -r 'preg_match("/^ \* Version:\s*(\S+)/m", file_get_contents("seo-studio.php"), $m) || exit(1); echo $m[1];')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          test -f "dist/zoop-${version}.zip"

      - name: Attach the zip to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Zoop ${{ steps.version.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/zoop-${{ steps.version.outputs.version }}.zip
          body: |
            Upload `zoop-${{ steps.version.outputs.version }}.zip` in WordPress: Plugins → Add New → Upload Plugin.

            That file is the plugin. It contains one folder, `zoop/`, with `seo-studio.php`, `vendor/`, and `assets/build/`.

            Do not upload a GitHub Actions artifact. Actions wraps this zip in a second zip, and WordPress then reports that no valid plugins were found. Code → Download ZIP is the source tree and is not installable either.

            This release is a draft. Publishing it makes the asset a direct download: `https://github.com/j44mes/Zoop/releases/download/v${{ steps.version.outputs.version }}/zoop-${{ steps.version.outputs.version }}.zip`.
