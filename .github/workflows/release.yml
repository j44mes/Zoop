name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build admin assets
        run: |
          npm ci
          npm run build

      - name: Require the tag to match the plugin version
        run: php scripts/check-release-tag.php "${GITHUB_REF_NAME}"

      - name: Stamp the checked-out commit into the zip
        run: |
          php scripts/validate-version.php
          php scripts/stamp-build.php
          php scripts/assert-build-identity.php

      - name: Pack the plugin
        run: php scripts/package-plugin.php

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/seo-studio-*.zip
