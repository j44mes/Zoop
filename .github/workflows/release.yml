name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the installable plugin
        run: bash scripts/package-plugin.sh

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zoop-*.zip
