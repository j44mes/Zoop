name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, intl
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse

      - name: Test
        run: composer test

      - name: Coverage for scoring and content
        run: |
          vendor/bin/phpunit --testsuite unit --coverage-text --coverage-clover coverage/clover.xml
          php scripts/coverage-floor.php coverage/clover.xml 95 src/Content src/Scoring

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, intl
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start the WordPress test suite
        run: |
          npm install -g @wordpress/env
          printf '{\n  "core": "WordPress/WordPress#6.6",\n  "phpVersion": "%s",\n  "plugins": ["."]\n}\n' "${{ matrix.php }}" > .wp-env.override.json
          wp-env start

      - name: Integration tests
        run: |
          plugin="$(basename "$PWD")"
          wp-env run tests-cli --env-cwd="wp-content/plugins/${plugin}" phpunit -c phpunit.integration.xml.dist
